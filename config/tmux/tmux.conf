set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

set -g prefix C-s
unbind C-b
bind-key C-s send-prefix

set-option focus-events on
set -s escape-time 10
set-option -g default-terminal "xterm-ghostty"

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source ~/.config/tmux/tmux.conf

bind -r m resize-pane -Z

# herdr parity: prefix+tab / prefix+shift+tab cycle tabs (windows in tmux).
# Direct jumps stay on the default prefix+1..9.
bind-key Tab next-window
bind-key BTab previous-window

# Native floating command prompt (tmux ≥ 3.8: command-prompt -P opens the
# prompt inside a centred pane instead of the status line, so it never touches
# the tab line). Explicit bind — reloading never restores key-table defaults.
# Supersedes bin/tmux-popup-prompt (deleted when tmux hit 3.8).
bind-key : command-prompt -P

# herdr parity: prefix+t floating scratch console — transient shell overlay,
# closes when the shell exits (mirrors herdr's [[keys.command]] popup).
bind-key t display-popup -w 80% -h 80% -E 'exec "${SHELL:-sh}"'

# herdr parity: prefix+shift+x closes the tab/window (herdr's keys.close_tab).
# prefix+x keeps its default pane kill; & stays as the legacy window kill.
bind-key X confirm-before -p "kill-window #W? (y/n)" kill-window

bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane
set -g status-position top

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.1.0'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tpm'

set -g @vim_navigator_mapping_right 'C-l'
set -g @vim_navigator_mapping_down 'C-j'
set -g @vim_navigator_mapping_up 'C-k'
set -g @vim_navigator_mapping_left 'C-h'
set -g @vim_navigator_mapping_prev ''
set -g @vim_navigator_prefix_mapping_clear_screen ''

set -g @catppuccin_flavor "frappe"
set -g @catppuccin_window_status_style "rounded"
run-shell "$HOME/.config/tmux/plugins/tmux/catppuccin.tmux"

set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_application}"

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

set -g @yank_selection_mouse 'clipboard'
set -g mouse on

# Should be at the very bottom of tmux.conf
run-shell "$HOME/.config/tmux/plugins/tpm/tpm"

# Command prompt/messages: bound + filled area, centered, so the prompt
# doesn't overlay the tab list (catppuccin's message-style has align=centre
# but no width/fill, which lets prompt text draw transparently over windows).
# Must run AFTER tpm — tpm re-sources catppuccin and would otherwise win.
set -g message-style "fg=#81c8be,bg=default,align=centre,width=50%,fill=default"
set -g message-command-style "fg=#81c8be,bg=default,align=centre,width=50%,fill=default"
